name: mobile_bank_app
description: "FrostBank Mobile, an offline Flutter banking application backed by a mock repository layer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  # Pinned: the only network dependency in the build, used by the Twelve Data
  # market client.
  http: 1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.8.0
  # Persistence_Store. supabase_flutter already pulls shared_preferences in for
  # its own session storage, so depending on it directly adds no native plugin.
  shared_preferences: ^2.3.0
  # Used to store a salted digest of the App_Lock PIN instead of the PIN itself.
  crypto: ^3.0.6
  # App_Lock biometric confirmation, with PIN entry as the fallback.
  local_auth: ^2.3.0
  # Requirement 17.5 needs a control that opens the operating system settings
  # when camera permission has been denied. Only openAppSettings is used.
  permission_handler: ^11.3.1
  # Requirement 15.11 writes the exported activity file to app storage.
  path_provider: ^2.1.4
  liquid_glass_easy: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # assets/brand holds the FrostBank mark and the card scheme artwork. The
    # scheme marks are third party trademarks, bundled for presentation only.
    - assets/brand/
    - assets/images/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
